    <h1>第一章 启程</h1>
    <p>灯塔在黎明前熄灭了,守塔人把最后一卷书放进行囊。海风翻动纸页,像在替他读出声来。</p>
    <p>他说:凡是读完就忘的书,本来就不该读完。于是他把这句话也写进了书里。</p>
