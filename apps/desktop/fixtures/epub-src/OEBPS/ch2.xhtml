    <h1>第二章 夜谈</h1>
    <p>夜里没有风。两个人对坐,中间隔着一盏灯,灯芯偶尔响一声,像替他们承认了什么。</p>
    <p>他们谈到了远处的城市,谈到了那里的电灯,以及电灯下面,再也看不见星星的人。</p>
  </body>
